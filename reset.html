<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaHost — Nowe hasło</title><style>body{background:#070d1b;color:#eef6ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0}.authbox{background:#101d34;border:1px solid #244b80;border-radius:18px;padding:32px;width:min(390px,90vw)}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;margin:9px 0}input{background:#081426;border:1px solid #45618a;color:white}button{background:#1689ed;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}a{color:#6fc0ff}#status{min-height:22px}</style></head><body><main class="authbox"><h1>Nova<span style="color:#229cff">Host</span></h1><h2>Ustaw nowe hasło</h2><p id="status" role="status" aria-live="polite">Sprawdzanie linku resetującego...</p><form id="form" hidden><label for="password">Nowe hasło (minimum 12 znaków)</label><input id="password" type="password" minlength="12" autocomplete="new-password" required><label for="confirm">Powtórz hasło</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button type="submit">Zapisz nowe hasło</button></form><a href="forgot.html">Wyślij nowy link</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="reset-auth.js"></script><script>const status=document.getElementById('status'),form=document.getElementById('form');(async()=>{try{const client=window.novaResetClient();let valid=false;const u=new URL(location.href);const code=u.searchParams.get('code');if(code){const {error}=await client.auth.exchangeCodeForSession(code);if(error)throw error;valid=true;u.searchParams.delete('code');history.replaceState({},'',u.pathname);}else{const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')==='recovery'&&hash.get('access_token')){const {error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')});if(error)throw error;valid=true;history.replaceState({},'',location.pathname);}}if(!valid)throw new Error('Link jest nieprawidłowy lub wygasł.');status.textContent='Link potwierdzony. Wprowadź nowe hasło.';form.hidden=false;}catch(err){status.textContent=err.message+' Poproś o nowy link.';}})();form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('password').value,b=document.getElementById('confirm').value;if(a!==b){status.textContent='Hasła nie są takie same.';return;}const button=form.querySelector('button');button.disabled=true;try{const client=window.novaResetClient();const {error}=await client.auth.updateUser({password:a});if(error)throw error;await client.auth.signOut();form.hidden=true;status.textContent='Hasło zmienione! Możesz teraz zalogować się nowym hasłem.';const link=document.createElement('a');link.href='login.html';link.textContent=' Przejdź do logowania';status.append(link);}catch(err){status.textContent='Błąd: '+err.message;}finally{button.disabled=false;}});</script></body></html>
