<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaHost — Przypomnij hasło</title><link rel="stylesheet" href="style.css"><style>body{background:#070d1b;color:#eef6ff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;margin:0}.authbox{background:#101d34;border:1px solid #244b80;border-radius:18px;padding:32px;width:min(390px,90vw)}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:8px;margin:9px 0}input{background:#081426;border:1px solid #45618a;color:white}button{background:#1689ed;color:white;border:0;cursor:pointer}a{color:#6fc0ff}#status{min-height:22px}</style></head><body><main class="authbox"><h1>Nova<span style="color:#229cff">Host</span></h1><h2>Odzyskaj hasło</h2><p>Wpisz e-mail użyty podczas rejestracji.</p><form id="form"><label for="email">Adres e-mail</label><input id="email" type="email" autocomplete="email" required><button type="submit">Wyślij link resetujący</button></form><p id="status" role="status" aria-live="polite"></p><a href="login.html">Wróć do logowania</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="config.js"></script><script src="reset-auth.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');const btn=e.target.querySelector('button');btn.disabled=true;status.textContent='Wysyłanie...';try{const client=window.novaResetClient();const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:new URL('reset.html',location.href).href});if(error)throw error;status.textContent='Jeśli konto istnieje, otrzymasz wiadomość z linkiem. Sprawdź też spam.';}catch(err){status.textContent='Nie udało się wysłać linku: '+err.message;}finally{btn.disabled=false;}});</script></body></html>
