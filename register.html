<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rejestracja — NovaHost</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">NOVA<span>HOST</span></a><a href="index.html">Strona główna</a></header><main><h1>Załóż konto</h1><p>Zarejestruj się, aby uzyskać dostęp do panelu NovaHost.</p><form onsubmit="register(event)"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Hasło (minimum 8 znaków)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><button class="full" type="submit">Utwórz konto</button></form><p id="status" class="status" role="status"></p><p>Masz już konto? <a href="login.html">Zaloguj się</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="auth.js"></script></body></html>
